<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="/js/events.js"></script>
    <h1>JavaScript HTML Events</h1>

    <button onclick="eventhandlermouse()">click me</button>
    <input type="text" name="name" placeholder="enter your name" onkeydown="eventhandlerkeyboard()">
    <input type="text" name="name" placeholder="enter your name" onkeyup="eventhandlerkeyboard()">

    <form action="" onsubmit="onsubmitevent()">
        <input type="number"
         name="Age" 
         placeholder="enter the age" 
         onfocus="onfocusevent()"
         onblur="onblurevent()">
         <!-- onchange="onchangeevent()" -->
        <select name="country" id="country" onchange="onchangeevent()">
            <option value="0">--select--</option>
            <option value="ind">india</option>
            <option value="us">usa</option>
            <option value="uk">london</option>
        </select>

        <input type="submit">
    </form>
</body>

</html>
